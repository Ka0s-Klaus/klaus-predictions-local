# Catálogo de fuentes de Pythia
#
# `status: implemented` significa que hay una clase en engine/feeds/sources/ y
# que su endpoint se ha comprobado contra el servicio real. El endpoint vive en
# la clase, no aquí, para que no haya dos sitios que se puedan desincronizar.
#
# `status: planned` es una fuente identificada pero sin código. NO se inventa su
# ruta de API: se deja el `homepage` y una nota con lo que falta por resolver.
# Añadir una fuente = implementar la clase, registrarla en sources/__init__.py
# y cambiar aquí el status.

version: 1

sources:
  # ------------------------------------------------------------------
  # Desastres naturales
  # ------------------------------------------------------------------
  - key: usgs_earthquakes
    name: USGS
    domain: disasters
    status: implemented
    homepage: https://earthquake.usgs.gov/earthquakes/feed/
    description: Sismos de magnitud 4.5+ en las últimas 24 horas.

  - key: eonet
    name: EONET
    domain: disasters
